<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termux Chat</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#202c33">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b141a;
    color: #e9edef;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #join-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    background: #0b141a;
  }
  #join-screen .logo {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00a884, #06cf9c);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700; color: white;
    box-shadow: 0 8px 24px rgba(0,168,132,0.4);
    margin-bottom: 6px;
    animation: floaty 3s ease-in-out infinite;
  }
  @keyframes floaty { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
  #join-screen h2 { font-weight: 700; font-size: 24px; }
  #join-screen input {
    padding: 14px 18px;
    border-radius: 24px;
    border: 1px solid #2a3942;
    background: #202c33;
    color: #fff;
    font-size: 16px;
    width: 270px;
    outline: none;
  }
  #join-screen input:focus { border: 1px solid #00a884; }
  #join-screen button, #chat-form button.send {
    padding: 14px 26px;
    border-radius: 24px;
    border: none;
    background: #00a884;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  #join-screen button:active { transform: scale(0.94); }
  #join-screen .hint { font-size: 12px; color: #8696a0; width: 270px; }

  #chat-screen { display: none; flex: 1; flex-direction: column; height: 100dvh; position: relative; }
  header {
    padding: 14px 16px;
    background: #202c33;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    z-index: 2;
  }
  header .avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #00a884, #06cf9c);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: white;
  }
  header .title { font-weight: 600; font-size: 17px; }
  #status-line { font-size: 12px; color: #8696a0; min-height: 16px; }

  #messages {
    justify-content: flex-end;
    flex: 1;
    overflow-y: auto;
    padding: 16px 5%;
    display: flex;
    flex-direction: column;
    gap: 3px;
    scroll-behavior: smooth;
    background: #0b141a;
  }
  .msg-wrap { display: flex; margin: 3px 0; }
  .msg-wrap.me { justify-content: flex-end; }
  .msg {
    max-width: 75%;
    padding: 7px 9px 6px 10px;
    border-radius: 8px;
    background: #202c33;
    position: relative;
    box-shadow: 0 1px 1px rgba(0,0,0,0.3);
    animation: pop 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  .msg-wrap.me .msg { background: #005c4b; }
  @keyframes pop { from { opacity:0; transform: scale(0.9);} to { opacity:1; transform: scale(1);} }
  .msg .name { font-size: 12.5px; font-weight: 700; color: #06cf9c; margin-bottom: 2px; }
  .msg .text { font-size: 14.5px; line-height: 1.35; word-wrap: break-word; padding-right: 44px; }
  .msg img.chat-img { max-width: 220px; border-radius: 8px; display: block; margin-top: 2px; }
  .msg audio { max-width: 220px; margin-top: 4px; }
  .msg .meta { display: flex; justify-content: flex-end; align-items: center; gap: 3px; margin-top: 2px; float: right; margin-left: 6px; }
  .msg .time { font-size: 11px; color: #8696a0; }
  .msg .ticks { font-size: 14px; color: #8696a0; }
  .msg .ticks.seen { color: #53bdeb; }

  .system {
    align-self: center;
    font-size: 12px;
    color: #8696a0;
    background: #182229;
    padding: 5px 12px;
    border-radius: 8px;
    margin: 6px auto;
  }

  #typing-indicator {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: #06cf9c;
    padding: 0 5% 6px; min-height: 20px;
  }
  .typing-dots { display: inline-flex; gap: 3px; }
  .typing-dots span { width: 5px; height: 5px; border-radius: 50%; background: #06cf9c; animation: bounce 1.2s infinite ease-in-out; }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity:0.5;} 30% { transform: translateY(-5px); opacity:1;} }

  #emoji-panel {
    display: none;
    background: #202c33;
    padding: 10px;
    max-height: 180px;
    overflow-y: auto;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
  }
  #emoji-panel.open { display: grid; }
  #emoji-panel span { font-size: 22px; text-align: center; cursor: pointer; padding: 4px; }

  #chat-form {
    display: flex;
    padding: 6px 6px;
    gap: 3px;
    background: #202c33;
    align-items: center;
    width: 100%;
    overflow: hidden;
  }
  #chat-form input[type=text] {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 24px;
    border: none;
    background: #2a3942;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  #chat-form button {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: none;
    background: #2a3942;
    color: #aebac1;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    padding: 0;
  }
  #chat-form button.send { background: #00a884; color: white; }
  #chat-form button.recording { background: #f15c6d; color: white; }
  #file-input { display: none; }
  #empty-placeholder {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    color: #6b7c88;
    padding: 40px 20px;
    margin: auto 0;
  }
  #empty-placeholder .emoji { font-size: 44px; }
  #empty-placeholder .txt { font-size: 14px; color: #6b7c88; line-height: 1.5; }
</style>
</head>
<body>
<div id="join-screen">
  <div class="logo">C</div>
  <h2>Termux Chat</h2>
  <input id="name-input" placeholder="Enter your name" autocomplete="off" />
  <input id="room-input" placeholder="Room name (e.g. family)" autocomplete="off" />
  <div class="hint">Same room name wale hi ek dusre se chat karenge</div>
  <button id="join-btn">Join Chat</button>
</div>

<div id="chat-screen">
  <header>
    <div class="avatar" id="header-avatar">C</div>
    <div>
      <div class="title" id="room-title">Termux Chat</div>
      <div id="status-line"></div>
    </div>
  </header>
  <div id="messages"><div id="empty-placeholder"><div class="emoji">👋</div><div class="txt">No messages yet<br>Say hi to start the conversation!</div></div></div>
  <div id="typing-indicator"></div>
  <div id="emoji-panel"></div>
  <form id="chat-form">
    <button type="button" id="emoji-btn">😊</button>
    <button type="button" id="img-btn">📷</button>
    <input type="file" id="file-input" accept="image/*">
    <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" />
    <button type="button" id="mic-btn">🎤</button>
    <button type="submit" class="send" id="send-btn">➤</button>
  </form>
</div>

<script>
  let ws; let myName = ''; let myRoom = 'general';
  let msgCounter = 0;
  let typingTimeout;
  const typingUsers = new Set();

  const joinScreen = document.getElementById('join-screen');
  const chatScreen = document.getElementById('chat-screen');
  const nameInput = document.getElementById('name-input');
  const roomInput = document.getElementById('room-input');
  const joinBtn = document.getElementById('join-btn');
  const messagesEl = document.getElementById('messages');
  const chatForm = document.getElementById('chat-form');
  const msgInput = document.getElementById('msg-input');
  const statusLine = document.getElementById('status-line');
  const typingIndicator = document.getElementById('typing-indicator');
  const roomTitle = document.getElementById('room-title');
  const emojiBtn = document.getElementById('emoji-btn');
  const emojiPanel = document.getElementById('emoji-panel');
  const imgBtn = document.getElementById('img-btn');
  const fileInput = document.getElementById('file-input');
  const micBtn = document.getElementById('mic-btn');

  const EMOJIS = ['😀','😂','😍','😊','😉','😢','😭','😡','👍','👎','🙏','🎉','❤️','🔥','😴','🤔','😎','😱','👋','🙌','💯','✨','🥳','😅','😇','😜','🤗','😳','🥺','😤','👏','💪'];
  EMOJIS.forEach(e => {
    const span = document.createElement('span');
    span.textContent = e;
    span.addEventListener('click', () => { msgInput.value += e; msgInput.focus(); });
    emojiPanel.appendChild(span);
  });
  emojiBtn.addEventListener('click', () => emojiPanel.classList.toggle('open'));

  function connect() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${location.host}`);
    ws.onopen = () => ws.send(JSON.stringify({ type: 'join', name: myName, room: myRoom }));
    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'system') addSystemMessage(data.text);
      else if (data.type === 'message' || data.type === 'image' || data.type === 'audio') {
        addChatMessage(data);
        if (data.name !== myName) ws.send(JSON.stringify({ type: 'seen', id: data.id }));
      }
      else if (data.type === 'seen') markSeen(data.id);
      else if (data.type === 'userlist') statusLine.textContent = data.users.join(', ');
      else if (data.type === 'typing') { typingUsers.add(data.name); updateTypingIndicator(); }
      else if (data.type === 'stopTyping') { typingUsers.delete(data.name); updateTypingIndicator(); }
    };
    ws.onclose = () => addSystemMessage('Disconnected from server');
  }

  function updateTypingIndicator() {
    if (typingUsers.size === 0) { typingIndicator.innerHTML = ''; return; }
    const names = [...typingUsers];
    const label = names.join(', ') + (names.length > 1 ? ' are typing' : ' is typing');
    typingIndicator.innerHTML = `${escapeHtml(label)}<span class="typing-dots"><span></span><span></span><span></span></span>`;
  }

  function addSystemMessage(text) {
    const div = document.createElement('div');
    div.className = 'system';
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addChatMessage(data) {
    const ph = document.getElementById('empty-placeholder');
    if (ph) ph.remove();
    const isMe = data.name === myName;
    const wrap = document.createElement('div');
    wrap.className = 'msg-wrap' + (isMe ? ' me' : '');
    const div = document.createElement('div');
    div.className = 'msg';
    if (data.id) div.dataset.id = data.id;

    let bodyHtml = '';
    if (data.type === 'image') {
      bodyHtml = `<img class="chat-img" src="${data.data}" />`;
    } else if (data.type === 'audio') {
      bodyHtml = `<audio controls src="${data.data}"></audio>`;
    } else {
      bodyHtml = `<span class="text">${escapeHtml(data.text)}</span>`;
    }

    div.innerHTML = `${!isMe ? `<div class="name">${escapeHtml(data.name)}</div>` : ''}${bodyHtml}
      <span class="meta"><span class="time">${data.time}</span>${isMe ? '<span class="ticks">✓</span>' : ''}</span>`;
    wrap.appendChild(div);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function markSeen(id) {
    const el = messagesEl.querySelector(`[data-id="${id}"]`);
    if (!el) return;
    const ticks = el.querySelector('.ticks');
    if (ticks) { ticks.textContent = '✓✓'; ticks.classList.add('seen'); }
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  joinBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    const room = roomInput.value.trim() || 'general';
    if (!name) return;
    myName = name; myRoom = room;
    document.getElementById('header-avatar').textContent = name.charAt(0).toUpperCase();
    roomTitle.textContent = 'Room: ' + room;
    joinScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    connect();
  });

  nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });
  roomInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });

  chatForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = msgInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    const id = 'm' + Date.now() + '_' + (msgCounter++);
    ws.send(JSON.stringify({ type: 'message', id, text }));
    ws.send(JSON.stringify({ type: 'stopTyping' }));
    msgInput.value = '';
    emojiPanel.classList.remove('open');
  });

  msgInput.addEventListener('input', () => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'typing' }));
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => ws.send(JSON.stringify({ type: 'stopTyping' })), 1500);
  });

  imgBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file || !ws || ws.readyState !== WebSocket.OPEN) return;
    const reader = new FileReader();
    reader.onload = () => {
      const id = 'm' + Date.now() + '_' + (msgCounter++);
      ws.send(JSON.stringify({ type: 'image', id, data: reader.result }));
    };
    reader.readAsDataURL(file);
    fileInput.value = '';
  });

  let mediaRecorder; let audioChunks = []; let isRecording = false;
  micBtn.addEventListener('click', async () => {
    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const id = 'm' + Date.now() + '_' + (msgCounter++);
            ws.send(JSON.stringify({ type: 'audio', id, data: reader.result }));
          };
          reader.readAsDataURL(blob);
          stream.getTracks().forEach(t => t.stop());
        };
        mediaRecorder.start();
        isRecording = true;
        micBtn.classList.add('recording');
        micBtn.textContent = '⏹';
      } catch (err) {
        alert('Microphone access nahi mila');
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎤';
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
